# ==============================================================================
# OENEXA PoS Consensus Validator Service — Standalone Stack
# ==============================================================================

version: "3.8"

services:
  oenexa-validator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oenexa-validator-standalone
    ports:
      - "8088:8088"
    environment:
      PORT: "8088"
      NODE_ENV: production
      VALIDATOR_PRIVATE_KEY: ${VALIDATOR_PRIVATE_KEY:-your_validator_key_here}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
